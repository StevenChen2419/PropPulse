# Copy to an external reviewed config directory; replace api.example.com there.
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/null crit;
events { worker_connections 512; }
http {
    # Neither headers, cookies, URLs/queries nor request bodies enter access logs.
    log_format redacted '$status $request_time';
    access_log /dev/stdout redacted;
    server_tokens off;
    include /etc/nginx/cloudflare.conf;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 10s;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 15s;
    proxy_cache off;
    proxy_buffering off;
    limit_req_status 429;
    map "$request_method:$uri" $auth_key {
        default "";
        ~^POST:/auth/(login|register)/?$ $binary_remote_addr;
    }
    map $request_method $api_key { default $binary_remote_addr; OPTIONS ""; }
    limit_req_zone $auth_key zone=auth:1m rate=10r/m;
    limit_req_zone $api_key zone=api:2m rate=30r/s;
    upstream backend { server backend:8000; }
    ssl_certificate /run/secrets/origin_cert;
    ssl_certificate_key /run/secrets/origin_key;
    # Must be YOUR zone's private client CA, not the shared Cloudflare client CA.
    ssl_client_certificate /run/secrets/cloudflare_client_ca;
    ssl_verify_client on;
    ssl_protocols TLSv1.2 TLSv1.3;
    server {
        listen 127.0.0.1:8080;
        access_log off;
        location = /health { return 200 "gateway alive\n"; }
        location / { return 404; }
    }
    server {
        listen 8443 ssl default_server;
        server_name _;
        return 444;
    }
    server {
        listen 8443 ssl;
        server_name api.example.com;
        # Original TCP peer checked independently of the rewritten client IP.
        if ($cloudflare_peer = 0) { return 403; }
        if ($http_cf_connecting_ip = "") { return 400; }
        if ($remote_addr = $realip_remote_addr) { return 400; }
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        error_page 429 = @limited;
        location @limited {
            default_type application/json;
            add_header Retry-After 60 always;
            add_header Cache-Control no-store always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options nosniff always;
            return 429 '{"detail":"Too many requests. Try again later."}';
        }
        location / {
            limit_req zone=auth burst=9 nodelay;
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";
            proxy_set_header CF-Connecting-IP "";
            proxy_http_version 1.1;
            # Backend owns exact-origin CORS, OPTIONS and session-bound CSRF.
            # Preserve Authorization, Cookie, Set-Cookie and Origin unchanged.
            add_header Cache-Control no-store always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options nosniff always;
        }
    }
}
