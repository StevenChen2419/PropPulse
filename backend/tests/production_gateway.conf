# Local verification only: test names, disposable certificate and loopback ingress.
# One gateway's shared zones coordinate its workers and both backend replicas.
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/null crit;
events { worker_connections 512; }
http {
    access_log off;
    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 10s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 15s;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    ssl_certificate /certs/test-cert.pem;
    ssl_certificate_key /certs/test-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    limit_req_status 429;
    # OPTIONS and non-POST auth paths must not consume credential budgets.
    map "$request_method:$uri" $auth_key {
        default "";
        ~^POST:/auth/(login|register)/?$ $binary_remote_addr;
    }
    map $request_method $api_key { default $binary_remote_addr; OPTIONS ""; }
    limit_req_zone $auth_key zone=auth:1m rate=10r/m;
    limit_req_zone $api_key zone=api:2m rate=30r/s;
    upstream backend { server pp-stage3-api-a:8000; server pp-stage3-api-b:8000; }
    server {
        listen 443 ssl default_server;
        server_name _;
        return 444;
    }
    server {
        listen 443 ssl;
        server_name app.proppulse.test;
        add_header Strict-Transport-Security "max-age=300" always;
        add_header X-Content-Type-Options nosniff always;
        location / {
            proxy_pass http://host.docker.internal:3199;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            proxy_http_version 1.1;
        }
    }
    server {
        listen 443 ssl;
        server_name api.proppulse.test;
        add_header Strict-Transport-Security "max-age=300" always;
        error_page 429 = @limited;
        location @limited {
            default_type application/json;
            add_header Retry-After 60 always;
            add_header Cache-Control no-store always;
            return 429 '{"detail":"Too many requests. Try again later."}';
        }
        location / {
            limit_req zone=auth burst=9 nodelay;
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $http_host;
            # Replace untrusted client forwarding; only this gateway is trusted.
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            proxy_http_version 1.1;
        }
    }
}
